# ==============================================================================
# StackLab.work - Production Nginx Configuration (Astro Static Site)
# Hardened for Zen Luxury E-Commerce, Stripe PCI DSS compliance & Cloudflare Tunnel
# ==============================================================================

# User configuration - runner runs unprivileged worker processes
user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

# Event-driven network I/O loop
events {
    worker_connections 1024;
    multi_accept on;
    use epoll;
}

http {
    # --------------------------------------------------------------------------
    # MIME Types & Streaming
    # --------------------------------------------------------------------------
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # --------------------------------------------------------------------------
    # Logging Configuration (Stdout / Stderr for Docker JSON-file driver)
    # --------------------------------------------------------------------------
    log_format main_json escape=json '{'
        '"time_local":"$time_local",'
        '"remote_addr":"$remote_addr",'
        '"request":"$request",'
        '"status": "$status",'
        '"body_bytes_sent":"$body_bytes_sent",'
        '"request_time":"$request_time",'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"cf_ray":"$http_cf_ray",'
        '"x_forwarded_for":"$http_x_forwarded_for"'
    '}';

    access_log /var/log/nginx/access.log main_json;
    error_log  /var/log/nginx/error.log warn;

    # --------------------------------------------------------------------------
    # Kernel Performance & TCP Optimization
    # --------------------------------------------------------------------------
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # --------------------------------------------------------------------------
    # Security Hardening (Information Disclosure)
    # --------------------------------------------------------------------------
    server_tokens off;

    # --------------------------------------------------------------------------
    # Gzip Compression Optimization
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff
        font/woff2
        application/vnd.ms-fontobject;

    # --------------------------------------------------------------------------
    # Server Block: StackLab Web
    # --------------------------------------------------------------------------
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        listen 3000;
        listen [::]:3000;
        server_name localhost stacklab.work www.stacklab.work;
        absolute_redirect off;

        root /usr/share/nginx/html;
        index index.html index.htm;

        # ----------------------------------------------------------------------
        # Container & Orchestrator Healthcheck
        # ----------------------------------------------------------------------
        location = /health {
            access_log off;
            default_type text/plain;
            return 200 'OK';
        }

        # ----------------------------------------------------------------------
        # Astro Static Assets Cache (Immutable Build Hashes)
        # 1 Year Cache (31536000s) + immutable directive
        # ----------------------------------------------------------------------
        location ^~ /_astro/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            access_log off;
            try_files $uri =404;
        }

        # ----------------------------------------------------------------------
        # Static Assets & Media (Images, Icons, Fonts)
        # 30 Days Cache
        # ----------------------------------------------------------------------
        location ~* \.(?:ico|png|jpe?g|gif|svg|webp|avif|woff2?|ttf|eot|otf)$ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            access_log off;
            try_files $uri =404;
        }

        # ----------------------------------------------------------------------
        # Main Routing (Static Site Generation / Clean URLs)
        # Security headers explicitly placed in location block to prevent
        # Nginx add_header inheritance loss trap
        # ----------------------------------------------------------------------
        location / {
            try_files $uri $uri/ $uri.html =404;
            
            # Cache Policy for HTML
            add_header Cache-Control "public, max-age=0, must-revalidate" always;
            
            # Clickjacking & MIME Defense
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            
            # Payment API allowed for Stripe
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self 'https://js.stripe.com')" always;
            
            # Content Security Policy (OWASP Compliant for Stripe & Google Fonts)
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://js.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https://images.unsplash.com https://*.stripe.com; frame-src 'self' https://js.stripe.com https://hooks.stripe.com https://checkout.stripe.com; connect-src 'self' https://api.stripe.com https://checkout.stripe.com; object-src 'none'; base-uri 'self'; form-action 'self' https://checkout.stripe.com; frame-ancestors 'self';" always;
        }

        # ----------------------------------------------------------------------
        # Error Pages
        # ----------------------------------------------------------------------
        error_page 404 /404.html;
        location = /404.html {
            internal;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            internal;
        }
    }
}
